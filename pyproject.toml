[project]
name = "et-al"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "rich>=13",
    "scholarly>=1.7",
    "bibtexparser>=1.4,<2",  # scholarly 1.7 imports the 1.x API (bibtexparser.bibdatabase) but does not cap it
]

[project.scripts]
etal = "etal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etal"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
